name: Agda

on:
  push:
    branches: [main]
    paths: ["examples/agda/**", ".github/workflows/agda.yml"]
  pull_request:
    paths: ["examples/agda/**", ".github/workflows/agda.yml"]

permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check examples/agda
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Agda and the standard library
        run: sudo apt-get update -q && sudo apt-get install -y -q agda-bin agda-stdlib
      # Agda rewrites the stdlib's interface files, and /usr/share is not
      # writable by the runner user, so check against a writable copy.
      - name: Copy the standard library to a writable path
        run: cp -r /usr/share/agda-stdlib "$RUNNER_TEMP/agda-stdlib"
      - name: Type-check
        working-directory: examples/agda
        env:
          LC_ALL: C.UTF-8
        run: agda -i "$RUNNER_TEMP/agda-stdlib" -i . NeSy.agda
