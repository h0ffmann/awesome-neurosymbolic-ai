name: Agda

on:
  push:
    branches: [main]
    paths: ["examples/agda/**", ".github/workflows/agda.yml"]
  pull_request:
    paths: ["examples/agda/**", ".github/workflows/agda.yml"]

permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check examples/agda
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Agda and the standard library
        run: sudo apt-get update -q && sudo apt-get install -y -q agda-bin agda-stdlib
      - name: Type-check
        working-directory: examples/agda
        env:
          LC_ALL: C.UTF-8
        run: agda -i /usr/share/agda-stdlib -i . NeSy.agda
