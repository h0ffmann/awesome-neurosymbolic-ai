name: Links

on:
  # Weekly sweep for link rot (Mondays 06:17 UTC — off the :00 rush).
  schedule:
    - cron: "17 6 * * 1"
  # Verify links touched by pull requests.
  pull_request:
    paths:
      - "README.md"
      - "contributing.md"
      - "code-of-conduct.md"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --cache
            --max-cache-age 3d
            README.md contributing.md code-of-conduct.md
          # Fail the check on pull requests; on the weekly run we file an issue instead.
          fail: ${{ github.event_name == 'pull_request' }}

      - name: Open an issue with the report (scheduled runs)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Link checker report"
          content-filepath: ./lychee/out.md
          labels: |
            broken-link
            automated
