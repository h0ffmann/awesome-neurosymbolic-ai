name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the git-repo-age rule doesn't false-positive.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Lint the source of truth: README.md is generated and intentionally
      # richer than the awesome-list format (metric tables).
      - name: Run awesome-lint
        run: npx --yes awesome-lint README.base.md

  z3-checks:
    name: Z3 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install z3
        run: sudo apt-get update -q && sudo apt-get install -y -q z3 && z3 --version
      - name: Decide structure, rankings, and banner fidelity with z3
        run: python scripts/smt_checks.py
      - name: Check the banner files are the pen's output
        run: python scripts/draw_banner.py --check
      - name: Ensure PRs edit README.base.md, not the generated README.md
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          if echo "$changed" | grep -qx 'README.md' && ! echo "$changed" | grep -qx 'README.base.md'; then
            echo "::error file=README.md::README.md is generated from README.base.md by scripts/build_readme.py — make your change in README.base.md instead."
            exit 1
          fi
